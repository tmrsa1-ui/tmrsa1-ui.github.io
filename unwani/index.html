<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="عنواني — محرك محلي لتحليل العناوين الخليجية غير المنظمة دون تسجيل ودون ادعاء تحقق رسمي." />
    <meta name="theme-color" content="#1c4f42" />
    <title>عنواني — Unwani</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="عنواني" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <div class="mark">عن</div>
        <div>
          <h1>عنواني <span class="muted">Unwani</span></h1>
          <p>تحليل محلي للعناوين الخليجية — بلا تسجيل</p>
        </div>
      </div>
    </header>
    <nav id="nav"></nav>
    <main>
      <section class="page active" data-page="parse">
        <h2>حلل عنوانًا</h2>
        <p class="disclaimer">التحليل في المتصفح. ليس تحققًا رسميًا. لا حفظ للعنوان في المتصفح.</p>
        <div class="chips" id="samples"></div>
        <textarea id="input" placeholder="ألصق العنوان"></textarea>
        <div class="row">
          <button class="primary" id="parseBtn">تحليل محلي</button>
          <button class="ghost" id="clearBtn">مسح</button>
          <button class="subtle" id="copyJsonBtn">نسخ JSON</button>
          <button class="subtle" id="copyShipBtn">نسخ عنوان الشحن</button>
        </div>
        <div id="result" style="margin-top:1rem"></div>
      </section>
    </main>
    <footer>الإصدار 0.1.3-beta. Apache-2.0. التحليل محلي. لا تحقق رسمي.</footer>
    <script src="./unwani-engine.js"></script>
    <script src="./app-standalone.js"></script>
  </body>
</html>
